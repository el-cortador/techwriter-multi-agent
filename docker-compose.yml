services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agent-network
    restart: unless-stopped

  hermes-discord:
    build:
      context: .
      dockerfile: hermes/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    volumes:
      - ./hermes/state:/app/state
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_GUILD_IDS: ${DISCORD_ALLOWED_GUILD_IDS:-}
      DISCORD_ALLOWED_CHANNEL_IDS: ${DISCORD_ALLOWED_CHANNEL_IDS:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      HERMES_STATE_DIR: /app/state
      HERMES_SKILLS_DIR: /app/skills
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-deepseek/deepseek-v4-pro}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      HERMES_VISION_MODEL: ${HERMES_VISION_MODEL:-google/gemini-2.5-flash}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      FIGMA_TOKEN: ${FIGMA_TOKEN:-}
      FIGMA_API_BASE: ${FIGMA_API_BASE:-https://api.figma.com/v1}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15}
      MAX_TOKENS: ${MAX_TOKENS:-4096}
      PROJECT_SLUG: ${PROJECT_SLUG:-techwriter-super-agent}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/agent_dashboard}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_COST_INPUT_PER_1M: ${LLM_COST_INPUT_PER_1M:-0.435}
      LLM_COST_OUTPUT_PER_1M: ${LLM_COST_OUTPUT_PER_1M:-0.87}
      VISION_COST_INPUT_PER_1M: ${VISION_COST_INPUT_PER_1M:-0.30}
      VISION_COST_OUTPUT_PER_1M: ${VISION_COST_OUTPUT_PER_1M:-2.50}
    networks:
      - agent-network
    restart: unless-stopped
    depends_on:
      - postgres

  dashboard-api:
    build:
      context: .
      dockerfile: dashboard-api/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/agent_dashboard}
      PROJECT_SLUG: ${PROJECT_SLUG:-techwriter-super-agent}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
      DASHBOARD_ALLOWED_ORIGINS: ${DASHBOARD_ALLOWED_ORIGINS:-http://127.0.0.1:4173}
    networks:
      - agent-network
    restart: unless-stopped
    depends_on:
      - postgres

  dashboard-ui:
    build: ./dashboard-ui
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-4173}:4173"
    networks:
      - agent-network
    restart: unless-stopped
    depends_on:
      - dashboard-api

networks:
  agent-network:
    driver: bridge

volumes:
  postgres-data:
