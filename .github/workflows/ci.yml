name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hermes dependencies
        run: pip install --no-cache-dir -r hermes/requirements.txt pytest

      - name: Run hermes tests
        run: python -m pytest hermes/tests -q

      - name: Install dashboard-api dependencies
        run: pip install --no-cache-dir -r dashboard-api/requirements.txt pytest

      - name: Run dashboard-api tests
        run: python -m pytest dashboard-api/tests -q

      - name: compileall
        run: python -m compileall hermes dashboard-api -q

  docker-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config -q

  dashboard-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
