name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: hermes
            context: .
            dockerfile: hermes/Dockerfile
          - service: dashboard-api
            context: .
            dockerfile: dashboard-api/Dockerfile
          - service: dashboard-ui
            context: ./dashboard-ui
            dockerfile: ./dashboard-ui/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/techwriter-multi-agent-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/techwriter-multi-agent-${{ matrix.service }}:latest

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure full, connected tag history
        run: git fetch --tags --force --unshallow origin || git fetch --tags --force origin

      - name: Build release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ] && grep -qF "## [$version]" CHANGELOG.md; then
            awk -v marker="## [$version]" '
              $0 == marker { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          else
            # Nearest lower version tag by name, not by commit-graph ancestry —
            # git describe needs a fully connected history that a checkout's
            # partial/shallow tag fetch does not reliably provide in CI.
            echo "::group::debug: tag list and previous_tag"
            git tag -l
            all_tags="$(git tag --sort=-v:refname)"
            echo "sorted tags: $all_tags"
            filtered="$(echo "$all_tags" | grep -vFx "${GITHUB_REF_NAME}" || true)"
            echo "after excluding current: $filtered"
            previous_tag="$(echo "$filtered" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
            echo "previous_tag=[$previous_tag]"
            echo "::endgroup::"
            {
              echo "CHANGELOG.md has no [$version] section yet — notes generated from commit messages."
              echo
              if [ -n "$previous_tag" ]; then
                git log --pretty=format:"- %s" "${previous_tag}..${GITHUB_REF_NAME}"
              else
                git log --pretty=format:"- %s" "${GITHUB_REF_NAME}"
              fi
            } > release-notes.md
          fi

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
