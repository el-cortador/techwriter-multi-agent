name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: hermes
            context: .
            dockerfile: hermes/Dockerfile
          - service: dashboard-api
            context: .
            dockerfile: dashboard-api/Dockerfile
          - service: dashboard-ui
            context: ./dashboard-ui
            dockerfile: ./dashboard-ui/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/techwriter-multi-agent-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/techwriter-multi-agent-${{ matrix.service }}:latest

  release:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Build release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ] && grep -qF "## [$version]" CHANGELOG.md; then
            awk -v marker="## [$version]" '
              $0 == marker { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          else
            # Fallback until CHANGELOG.md has a section for this version (task 6.1):
            # just the recent commit log, not a precisely bounded "since last tag"
            # range — this repo's older tags aren't reliably graph-connected in a
            # fresh CI checkout, which makes both `git describe` and `git log A..B`
            # unreliable for them.
            {
              echo "CHANGELOG.md has no [$version] section yet — notes generated from recent commit messages."
              echo
              git log --pretty=format:"- %s" -n 25
            } > release-notes.md
          fi

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
